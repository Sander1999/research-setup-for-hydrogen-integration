[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delft-dunite-darts"
version = "0.1.0"
description = "A hypothetical Delft-dunite hydrogen source and transport research model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["hydrogen_research*"]

[tool.setuptools.package-data]
"hydrogen_research.darts_source" = ["config.json", "README.md"]
